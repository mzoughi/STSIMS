const projectGrid = document.getElementById("projectGrid");
const resultsCount = document.getElementById("resultsCount");
const searchInput = document.getElementById("searchInput");
const courseFilter = document.getElementById("courseFilter");
const semesterFilter = document.getElementById("semesterFilter");
const topicFilter = document.getElementById("topicFilter");
const clearButton = document.getElementById("clearButton");
function escapeHTML(value) {
return String(value)
.replaceAll("&", "&amp;")
.replaceAll("<", "&lt;")
.replaceAll(">", "&gt;")
.replaceAll('"', "&quot;")
.replaceAll("'", "&#039;");
}
function populateSelect(select, values) {
values.forEach((value) => {
const option = document.createElement("option");
option.value = value;
option.textContent = value;
select.appendChild(option);
});
}
function semesterSort(a, b) {
const termOrder = { SP: 1, SM: 2, FA: 3 };
const yearA = Number(a.slice(-4));
const yearB = Number(b.slice(-4));
const termA = a.slice(0, 2);
const termB = b.slice(0, 2);
return yearB - yearA || (termOrder[termB] || 0) - (termOrder[termA] || 0);
}
function initializeFilters() {
const courses = [...new Set(projects.map((project) => project.course))].sort();
const semesters = [...new Set(projects.map((project) => project.semester))].sort(semesterSort);
const topics = [...new Set(projects.flatMap((project) => project.tags))].sort();
populateSelect(courseFilter, courses);
populateSelect(semesterFilter, semesters);
populateSelect(topicFilter, topics);
}
function searchableText(project) {
return [
project.title,
project.course,
project.semester,
project.term,
project.year,
project.students.join(" "),
project.description,
project.tags.join(" "),
project.links.map((link) => link.label).join(" ")
].join(" ").toLowerCase();
}
function createProjectCard(project) {
const students = project.students.map(escapeHTML).join(", ");
const tags = project.tags
.map((tag) => `<span class="tag">${escapeHTML(tag)}</span>`)
.join("");
const links = project.links
.map((link) => `
<a class="project-link" href="${escapeHTML(link.url)}" target="_blank" rel="noopener noreferrer"  aria-label="${escapeHTML(link.label)} for ${escapeHTML(project.title)}" >${escapeHTML(link.label)}</a>
`)
.join("");
return `
<article class="project-card">
<div class="card-accent" aria-hidden="true"></div>
<div class="card-body">
<div class="badges">
<span class="badge">${escapeHTML(project.course)}</span>
<span class="badge">${escapeHTML(project.semester)}</span></div>
<h2 class="project-title">${escapeHTML(project.title)}</h2>
<p class="students">
<strong>${project.students.length === 1 ? "Student:" : "Students:"}</strong>
${students}</p>
<p class="description">${escapeHTML(project.description)}</p>
<div class="tags" aria-label="Project topics">
${tags}</div>
<div class="project-links">
${links}</div></div></article>
`;
}
function getFilteredProjects() {
const query = searchInput.value.trim().toLowerCase();
const selectedCourse = courseFilter.value;
const selectedSemester = semesterFilter.value;
const selectedTopic = topicFilter.value;
return projects
.filter((project) => !query || searchableText(project).includes(query))
.filter((project) => selectedCourse === "all" || project.course === selectedCourse)
.filter((project) => selectedSemester === "all" || project.semester === selectedSemester)
.filter((project) => selectedTopic === "all" || project.tags.includes(selectedTopic))
.sort((a, b) => {
if (a.year !== b.year) return b.year - a.year;
const semesterComparison = semesterSort(a.semester, b.semester);
if (semesterComparison !== 0) return semesterComparison;
return a.title.localeCompare(b.title);
});
}
function renderProjects() {
const filteredProjects = getFilteredProjects();
const count = filteredProjects.length;
resultsCount.textContent = `${count} ${count === 1 ? "project" : "projects"} found`;
if (count === 0) {
projectGrid.innerHTML = `
<div class="empty-state">
<h2>No matching projects</h2>
<p>Try a different search term or clear one of the filters.</p></div>
`;
return;
}
projectGrid.innerHTML = filteredProjects.map(createProjectCard).join("");
}
function clearFilters() {
searchInput.value = "";
courseFilter.value = "all";
semesterFilter.value = "all";
topicFilter.value = "all";
renderProjects();
searchInput.focus();
}
searchInput.addEventListener("input", renderProjects);
courseFilter.addEventListener("change", renderProjects);
semesterFilter.addEventListener("change", renderProjects);
topicFilter.addEventListener("change", renderProjects);
clearButton.addEventListener("click", clearFilters);
initializeFilters();
renderProjects();</script>
